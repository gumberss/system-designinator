[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-harness"
version = "0.2.0"
description = "Provider-independent, bounded asynchronous agent runtime"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<8",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "PyJWT[crypto]>=2.10,<3",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.5,<2",
    "mypy>=1.14,<2",
    "types-protobuf>=5,<8",
    "types-jsonschema>=4.23,<5",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"
agent-harness-durable = "agent_harness.durable_cli:main"
agent-harness-api = "agent_harness.api:main"
agent-harness-admin = "agent_harness.admin:main"
agent-harness-secure-worker = "agent_harness.secure_worker:main"
agent-harness-eval = "agent_harness.evaluation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_harness.adapters" = ["*.sql", "*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires isolated PostgreSQL and Redis URLs"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
