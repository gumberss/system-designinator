name: ai-agent-harness
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${HARNESS_OTLP_PORT:-54318}:4318"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${HARNESS_POSTGRES_DB:-harness}
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${HARNESS_POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:${HARNESS_POSTGRES_PORT:-55483}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${HARNESS_REDIS_PASSWORD:?Set a local Redis password}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no"]
    ports:
      - "127.0.0.1:${HARNESS_REDIS_PORT:-56483}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
