resolver 127.0.0.11 valid=5s ipv6=off;
upstream request_vehicle {
    zone request_vehicle 64k;
    least_conn;
    server request-vehicle:58150 resolve;
    server request-vehicle-2:58150 resolve;
    keepalive 16;
}
upstream trips { zone trips 64k; server trip-manager:58110 resolve; keepalive 16; }
upstream locations { zone locations 64k; server location-manager:58120 resolve; keepalive 16; }
upstream map_index { zone map_index 64k; server quadtree-map:58130 resolve; keepalive 4; }

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # Never transparently replay a POST. The client owns its idempotency key.
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;

    location = /health/ready { proxy_pass http://request_vehicle; }
    location = /api/trips { proxy_pass http://request_vehicle; }
    location = /api/system/map { proxy_pass http://map_index; }
    location = /api/demo/drivers { proxy_pass http://locations; }
    location ~ ^/api/(drivers|riders)/ {
        proxy_pass http://locations;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/(trips/|passengers$|demo/trips$) {
        proxy_pass http://trips;
        proxy_read_timeout 60s;
    }
    location /internal/ { return 404; }
    location /api/ { default_type application/json; return 404 '{"error":"Endpoint nao encontrado."}'; }
    location / { try_files $uri $uri/ =404; }
}
