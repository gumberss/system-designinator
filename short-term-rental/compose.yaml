name: short-term-rental

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: short-term-rental
      POSTGRES_USER: short-term-rental
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short-term-rental -d short-term-rental"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: short-term-rental
      RABBITMQ_DEFAULT_PASS: local-development-only
    ports:
      - "127.0.0.1:55672:5672"
      - "127.0.0.1:55673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  api: &api
    build:
      context: .
      dockerfile: src/ShortTermRental.Api/Dockerfile
    ports:
      - "127.0.0.1:58080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Database=short-term-rental;Username=short-term-rental;Password=local-development-only;Maximum Pool Size=50;Timeout=5;Command Timeout=15;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: short-term-rental
      RabbitMq__Password: local-development-only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api2:
    <<: *api
    profiles: ["multi-instance"]
    ports:
      - "127.0.0.1:58081:8080"

volumes:
  postgres-data:
  rabbitmq-data:
