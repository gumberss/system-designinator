[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mapinator"
version = "0.7.0"
description = "Incremental Python mapping and navigation laboratory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "uvicorn[standard]>=0.34,<1",
    "aiokafka>=0.12,<1",
    "redis>=5.2,<7",
    "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "mypy>=1.14,<2", "ruff>=0.9,<1", "types-defusedxml>=0.7", "types-psutil>=7"]

[project.scripts]
mapinator = "mapinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mapinator = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires isolated real PostgreSQL/PostGIS"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
