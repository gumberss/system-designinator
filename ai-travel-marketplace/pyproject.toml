[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-travel-marketplace"
version = "0.1.0"
description = "Educational Python travel marketplace and distributed systems lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "mcp>=2,<3",
    "PyJWT>=2.10,<3.0",
    "aiokafka>=0.12,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
